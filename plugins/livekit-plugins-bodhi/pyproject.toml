[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-bodhi"
dynamic = ["version"]
description = "LiveKit Agents plugin for Bodhi (Navana Tech) STT and TTS"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Navana Tech" }]
keywords = ["voice", "ai", "realtime", "audio", "livekit", "bodhi", "navana", "stt", "tts"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "livekit-agents>=1.0",
    "bodhi-api-sdk>=1.3",
]

[project.urls]
Homepage = "https://www.navanatech.in/"
Source = "https://github.com/navana-tech/bodhi-python-sdk"

[tool.hatch.version]
path = "livekit/plugins/bodhi/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "/README.md"]
